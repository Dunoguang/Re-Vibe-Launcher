<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Re-Vibe Launcher 权限管理</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 24px 16px 40px;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 4px;
            background: linear-gradient(90deg, #ff6fd8, #ffb86c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.4;
            margin-bottom: 24px;
        }
        .section {
            background: rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.4;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .perm-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            border-radius: 6px;
            margin: 0 -8px;
            padding-left: 8px;
            padding-right: 8px;
        }
        .perm-item:last-child { border-bottom: none; }
        .perm-item:active {
            background: rgba(255,255,255,0.08);
            transform: scale(0.98);
        }
        .perm-item.loading {
            opacity: 0.5;
            pointer-events: none;
        }
        .perm-name {
            font-size: 0.9rem;
            opacity: 0.8;
            flex: 1;
        }
        .perm-name .desc {
            font-size: 0.7rem;
            opacity: 0.35;
            display: block;
            margin-top: 1px;
        }
        .perm-status {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
            flex-shrink: 0;
            transition: all 0.2s;
            min-width: 70px;
            text-align: center;
        }
        .granted { background: rgba(52,199,89,0.2); color: #34c759; }
        .denied  { background: rgba(255,69,58,0.2); color: #ff453a; }
        .unknown { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.3); }
        .pending { background: rgba(255,204,0,0.2); color: #ffcc00; }

        .refresh-btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 16px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            transition: background 0.2s;
        }
        .refresh-btn:active { background: rgba(255,255,255,0.18); }
        .refresh-btn:disabled { opacity: 0.4; pointer-events: none; }

        .badge {
            display: inline-block;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            vertical-align: middle;
        }
        .badge-all { background: rgba(52,199,89,0.15); color: #34c759; }
        .badge-partial { background: rgba(255,204,0,0.15); color: #ffcc00; }

        .summary {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.85rem;
            opacity: 0.6;
        }
        .summary strong {
            opacity: 1;
            color: #ffb86c;
        }

        /* Toast 消息 */
        #toast {
            position: fixed;
            bottom: 80px;
            white-space: pre-line;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 85vw;
            text-align: center;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #toast.success { border-color: rgba(52,199,89,0.4); }
        #toast.error { border-color: rgba(255,69,58,0.4); }

        /* 点击提示 */
        .click-hint {
            font-size: 0.65rem;
            opacity: 0.2;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>✨ Re-Vibe Launcher</h1>
    <p class="subtitle">权限管理 · 点击即可申请授权</p>

    <div class="summary" id="summary">检查中...</div>
    <div class="summary" id="device-info" style="font-size:0.75rem;opacity:0.35;margin-top:-12px;margin-bottom:16px;"></div>

    <div id="perm-container"></div>

    <p class="click-hint">👆 点击任意未授权项进行授权</p>

    <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="refresh-btn" style="flex:1;" onclick="openFloatWindow()">🪟 开启悬浮窗</button>
        <button class="refresh-btn" style="flex:1;" onclick="closeFloatWindow()">✖️ 关闭悬浮窗</button>
    </div>

    <button class="refresh-btn" onclick="checkPermissions()">🔄 刷新状态</button>

    <div id="toast"></div>

    <script>
    // ===================== 权限定义 =====================
    const PERM_GROUPS = {
        '运行时权限': [
            { key: 'locationFine',     name: '精确位置',        desc: 'ACCESS_FINE_LOCATION' },
            { key: 'locationCoarse',   name: '粗略位置',        desc: 'ACCESS_COARSE_LOCATION' },
            { key: 'phoneState',       name: '读取电话状态',    desc: 'READ_PHONE_STATE' },
            { key: 'camera',           name: '相机',            desc: 'CAMERA' },
            { key: 'notifications',    name: '通知',            desc: 'POST_NOTIFICATIONS' }
        ],
        '特殊权限': [
            { key: 'writeSettings',    name: '修改系统设置',    desc: 'WRITE_SETTINGS' },
            { key: 'overlay',          name: '悬浮窗',          desc: 'SYSTEM_ALERT_WINDOW' },
            { key: 'notificationListener', name: '通知监听',    desc: 'BIND_NOTIFICATION_LISTENER' }
        ],
        'Shell 通道': [
            { key: 'shellTest',        name: '通道自检',        desc: '执行 id -u 验证最高可用权限通道' }
        ],
        '系统功能': [
            { key: 'deviceAdmin',      name: '设备管理员',      desc: '锁屏权限' }
        ],
        'WiFi 权限': [
            { key: 'wifiState',        name: 'WiFi 状态',       desc: 'ACCESS_WIFI_STATE' },
            { key: 'wifiChange',       name: '修改 WiFi',       desc: 'CHANGE_WIFI_STATE' },
            { key: 'networkState',     name: '网络状态',        desc: 'ACCESS_NETWORK_STATE' }
        ]
    };

    let lastStatus = {};
    let callbackCounter = 0;
    // 正在请求中的权限 key 集合
    const pendingKeys = new Set();

    // ===================== 回调接收（由 NativeBridge 调用） =====================
    window._onPermissionResult = function(data) {
        console.log('[权限回调]', JSON.stringify(data));
        const { callbackId, success, message } = data;

        pendingKeys.clear();
        showToast(message, success ? 'success' : 'error');
        // 延迟一下再刷新，给系统一点时间更新状态
        setTimeout(checkPermissions, 500);
    };

    // ===================== 显示 Toast =====================
    let toastTimer = null;
    function showToast(msg, type, duration) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'show ' + (type || '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.className = ''; }, duration || 3000);
    }

    // ===================== 请求权限 =====================
    function requestPerm(permKey) {
        // 通道自检不是权限申请，走特权通道实际执行验证
        if (permKey === 'shellTest') {
            testShellChannel();
            return;
        }
        if (pendingKeys.has(permKey)) return; // 已在请求中
        if (lastStatus[permKey] === true) {
            showToast('✅ 该权限已授权', 'success');
            return;
        }

        pendingKeys.add(permKey);
        const callbackId = 'perm_' + (++callbackCounter);

        // 更新 UI 为 pending 状态
        updateItemStatus(permKey, 'pending', '⏳ 请求中...');

        try {
            NativeBridge.requestPermission(permKey, callbackId);
        } catch(e) {
            pendingKeys.delete(permKey);
            updateItemStatus(permKey, 'denied', '❌ 调用失败');
            showToast('⚠️ NativeBridge 不可用（请运行在真机或模拟器中）', 'error');
        }
    }

    // ===================== Shell 通道自检（点击权限列表"通道自检"项） =====================
    const CHANNEL_LABELS = {
        root: '👑 Root直连',
        shell: '🔧 Shell直连',
        su: '🔫 SU提权',
        shizuku: '🔌 Shizuku',
        shizuku_pending: '🔌 Shizuku待授权',
        none: '❌ 无特权'
    };

    async function testShellChannel() {
        updateItemStatus('shellTest', 'pending', '⏳ 检测中...');
        try {
            const r = await execPrivileged('id -u; echo ---; getprop ro.build.version.sdk; echo ---; command -v su');
            const label = CHANNEL_LABELS[r.channel] || r.channel;
            if (r.channel && r.channel !== 'none') {
                const firstLine = (r.stdout || '').split('\n')[0].trim() || '?';
                updateItemStatus('shellTest', 'granted', '✅ ' + label);
                showToast('通道: ' + label + '\nuid=' + firstLine + '\n输出: ' + (r.stdout || '').trim().replace(/\n/g, ' ').slice(0, 100), 'success', 6000);
            } else {
                updateItemStatus('shellTest', 'denied', '❌ 无特权');
                showToast('❌ 无可用特权通道\n' + (r.stderr || '(无错误输出)'), 'error', 6000);
            }
        } catch(e) {
            updateItemStatus('shellTest', 'denied', '❌ 失败');
            showToast('⚠️ 通道自检失败: ' + e.message, 'error');
        }
    }

    // ===================== 更新单个权限项的 UI =====================
    function updateItemStatus(permKey, statusClass, statusText) {
        const item = document.querySelector(`.perm-item[data-permkey="${permKey}"]`);
        if (!item) return;
        const badge = item.querySelector('.perm-status');
        if (badge) {
            badge.className = 'perm-status ' + statusClass;
            badge.textContent = statusText;
        }
    }

    // ===================== 查询所有权限状态 =====================
    function checkPermissions() {
        document.getElementById('summary').textContent = '⏳ 查询中...';
        const container = document.getElementById('perm-container');
        container.innerHTML = '<div style="text-align:center;padding:40px;opacity:0.3;">正在获取权限状态...</div>';

        try {
            const json = NativeBridge.getPermissionStatus();
            lastStatus = JSON.parse(json);
            renderPermissions(lastStatus);
        } catch(e) {
            container.innerHTML = '<div style="text-align:center;padding:40px;opacity:0.3;">⚠️ NativeBridge 不可用<br><span style="font-size:0.7rem;">请在真机或模拟器中运行</span></div>';
            document.getElementById('summary').textContent = '❌ 桥接未连接';
        }
    }

    // ===================== 渲染权限列表 =====================
    // ===================== 设备能力检测（前端侧，通过 execShell） =====================
    let deviceInfo = { apiLevel: null, uid: null, isRoot: false, isShell: false, hasSu: false, shizukuConnected: false, shizukuGranted: false };

    // 设备能力检测（后端一次性返回：uid/root/shell/su/Shizuku 连接与授权/AppOps PROJECT_MEDIA/apiLevel）
    async function detectDevice() {
        const infoEl = document.getElementById('device-info');
        if (!infoEl) return;
        infoEl.innerHTML = '⏳ 检测设备能力...';
        try {
            if (!NativeBridge.getDeviceCapabilities) throw new Error('getDeviceCapabilities 不可用');
            const data = await new Promise((resolve, reject) => {
                const callbackId = 'dc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                window._onDeviceCapabilities = function(j) {
                    const d = (typeof j === 'string') ? JSON.parse(j) : j;
                    if (d.callbackId === callbackId) resolve(d);
                };
                try { NativeBridge.getDeviceCapabilities(callbackId); }
                catch(e) { reject(e); }
            });
            deviceInfo = data;
            updateDeviceInfo();
        } catch(e) {
            infoEl.innerHTML = '⚠️ 设备检测失败';
        }
    }

    function updateDeviceInfo() {
        const el = document.getElementById('device-info');
        if (!el) return;
        const parts = [];
        if (deviceInfo.apiLevel) parts.push('Android ' + deviceInfo.apiLevel);
        if (deviceInfo.uid != null) parts.push('UID ' + deviceInfo.uid);
        if (deviceInfo.isRoot) parts.push('👑 Root');
        else if (deviceInfo.isShell) parts.push('🔧 Shell');
        else parts.push('📱 App');
        if (deviceInfo.hasSu) parts.push('🔫 su');
        if (deviceInfo.shizukuConnected) {
            parts.push(deviceInfo.shizukuGranted ? '🔌 Shizuku ✓' : '🔌 Shizuku(未授权)');
        }
        // 最优特权执行通道
        if (deviceInfo.channel) {
            const labels = {
                root: '👑 Root直连',
                shell: '🔧 Shell直连',
                su: '🔫 SU提权',
                shizuku: '🔌 Shizuku',
                shizuku_pending: '🔌 Shizuku待授权',
                none: '❌ 无特权'
            };
            parts.push('通道:' + (labels[deviceInfo.channel] || deviceInfo.channel));
        }
        el.innerHTML = '设备: ' + parts.join(' · ');
    }

    // ========== execShell 封装（同原项目 shell.js） ==========
    function execShell(command) {
        return new Promise((resolve, reject) => {
            if (typeof NativeBridge === 'undefined' || !NativeBridge.execShell) {
                reject('NativeBridge.execShell 不可用');
                return;
            }
            const callbackId = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            window._onShellResult = function(result) {
                try {
                    const r = (typeof result === 'string') ? JSON.parse(result) : result;
                    if (r.callbackId !== callbackId) return;
                    resolve({
                        stdout: r.stdout || '',
                        stderr: r.stderr || '',
                        success: r.statusCode === 0,
                        statusCode: r.statusCode
                    });
                } catch (e) {
                    reject('回调解析失败: ' + e.message);
                }
            };
            NativeBridge.execShell(command, callbackId);
        });
    }

    // ========== execPrivileged 封装（自动选择最高权限通道） ==========
    function execPrivileged(command) {
        return new Promise((resolve, reject) => {
            if (typeof NativeBridge === 'undefined' || !NativeBridge.execPrivileged) {
                reject('NativeBridge.execPrivileged 不可用');
                return;
            }
            const callbackId = 'ep_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            window._onPrivilegedResult = function(result) {
                try {
                    const r = (typeof result === 'string') ? JSON.parse(result) : result;
                    if (r.callbackId !== callbackId) return;
                    resolve(r);
                } catch (e) {
                    reject('回调解析失败: ' + e.message);
                }
            };
            NativeBridge.execPrivileged(command, callbackId);
        });
    }

    function renderPermissions(status) {
        const container = document.getElementById('perm-container');
        let html = '';
        let granted = 0, total = 0;

        for (const [groupName, perms] of Object.entries(PERM_GROUPS)) {
            html += '<div class="section">';
            html += '<div class="section-title">' + groupName + '</div>';

            for (const p of perms) {
                total++;
                const val = status[p.key];
                const isGranted = val === true;
                if (isGranted) granted++;

                // 判断状态：优先显示 pending，其次真实状态
                const isPending = pendingKeys.has(p.key);
                let statusClass, statusText;
                if (p.key === 'shellTest' && !isPending) {
                    statusClass = 'unknown';
                    statusText = '👆 点击检测';
                } else if (isPending) {
                    statusClass = 'pending';
                    statusText = '⏳ 请求中...';
                } else if (val === true) {
                    statusClass = 'granted';
                    statusText = '✅ 已授权';
                } else if (val === false) {
                    statusClass = 'denied';
                    statusText = '❌ 未授权';
                } else {
                    statusClass = 'unknown';
                    statusText = '— 未知';
                }

                html += '<div class="perm-item" data-permkey="' + p.key + '" onclick="requestPerm(\'' + p.key + '\')">';
                html += '<div class="perm-name">' + p.name + '<span class="desc">' + p.desc + '</span></div>';
                html += '<div class="perm-status ' + statusClass + '">' + statusText + '</div>';
                html += '</div>';
            }
            html += '</div>';
        }

        container.innerHTML = html;

        // 计算摘要
        const pct = total > 0 ? Math.round(granted / total * 100) : 0;
        const summary = document.getElementById('summary');
        if (granted === total) {
            summary.innerHTML = '🎉 所有 <strong>' + total + '</strong> 项权限已全部授权';
        } else {
            summary.innerHTML = '📋 已授权 <strong>' + granted + '</strong> / ' + total +
                ' 项（<strong>' + pct + '%</strong>）' +
                ' · 未授权 <strong style="color:#ff453a;">' + (total - granted) + '</strong> 项' +
                ' · 点击项授权';
        }
    }

    // ===================== 悬浮窗控制 =====================
    window._onFloatWindowTap = function(data) {
        const d = (typeof data === 'string') ? JSON.parse(data) : data;
        if (d.success) {
            showToast('👋 悬浮窗已关闭', 'success');
            setTimeout(checkPermissions, 300);
        } else {
            showToast('⚠️ ' + (d.message || '悬浮窗操作失败'), 'error');
        }
    };

    function openFloatWindow() {
        // 先检查悬浮窗权限
        if (lastStatus.overlay === false) {
            showToast('⚠️ 需要悬浮窗权限，请先授权', 'error');
            // 自动跳转授权
            requestPerm('overlay');
            return;
        }
        try {
            NativeBridge.showFloatWindow('fw_' + Date.now());
            showToast('🪟 下拉展开控制中心', 'success');
        } catch(e) {
            showToast('⚠️ 调用失败: ' + e.message, 'error');
        }
    }

    function closeFloatWindow() {
        try {
            NativeBridge.hideFloatWindow();
            showToast('✖️ 悬浮窗已手动关闭', 'success');
        } catch(e) {
            showToast('⚠️ 调用失败: ' + e.message, 'error');
        }
    }

    // ===================== 窗口大小变化监听 =====================
    // 横竖屏切换或窗口大小变化时，通知后端重新计算悬浮窗尺寸
    let resizeTimer = null;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
            try {
                NativeBridge.updateFloatWindowSize();
            } catch(e) {}
        }, 200);
    });
    window.addEventListener('orientationchange', function() {
        // 横竖屏切换后延迟等布局稳定再更新
        setTimeout(function() {
            try {
                NativeBridge.updateFloatWindowSize();
            } catch(e) {}
        }, 400);
    });

    // ===================== 页面加载 =====================
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(checkPermissions, 300);
        setTimeout(detectDevice, 600);
    });
    </script>
</body>
</html>
