<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>液态玻璃 · 控制中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #cc { position: relative; }

  /* 覆盖 liquid-glass 组件的默认样式，适配控制中心 */
  /* 面板：始终适合视口的正方形（不超宽、不超高） */
  liquid-glass .lg-glass {
    display: block;
    gap: 0;
    width: min(660px, 92vw, 88vh);
    height: auto;
    aspect-ratio: 1 / 1;
    box-shadow: none !important;   /* 清除 shadow-styles.js 注入的 .lg-glass 类阴影（保留边框高光） */
  }
  /* 边框高光：保留白色描边，去掉其中混入的黑色投影（0 1px 4px rgba(0,0,0,.35)） */
  liquid-glass .lg-border,
  liquid-glass .lg-border--overlay {
    box-shadow:
      0 0 0 0.5px rgba(255, 255, 255, 0.5) inset,
      0 1px 3px rgba(255, 255, 255, 0.25) inset !important;
  }
  liquid-glass .lg-content {
    font: inherit;
    color: inherit;
    text-shadow: none;
    display: block;
    width: 100%;
    height: 100%;   /* 填满面板，网格才能铺满正方形 */
  }

  /* 控制中心网格 */
  .cc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
    height: 100%;
    min-height: 0;
  }

  /* 卡片 */
  /* 内部卡片：半透明白 + 高光描边（磨砂由父面板统一提供） */
  .cc-card {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow:
      inset 0 0 0 0.5px rgba(255,255,255,0.28),
      inset 0 1px 3px rgba(255,255,255,0.12),
      0 2px 8px rgba(0,0,0,0.10);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 0 12px;
    cursor: pointer;
    transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    color: rgba(255,255,255,0.92);
  }
  .cc-card:active { transform: scale(0.97); }
  /* 拖动中：无过渡（卡片已无磨砂，无需再关） */
  .cc-card.dragging { transition: none; }
  .cc-card.active {
    background: rgba(255,255,255,0.32);
    box-shadow:
      inset 0 0 0 0.5px rgba(255,255,255,0.55),
      inset 0 1px 4px rgba(255,255,255,0.2),
      0 2px 12px rgba(255,255,255,0.12);
  }
  .cc-card.active .cc-label { font-weight: 600; }
  .cc-card.active .cc-icon-circle { background: rgba(255,255,255,0.4); }

  .cc-icon-circle {
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.18);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background 0.25s;
  }
  .cc-icon-circle svg { width: 22px; height: 22px; fill: none; stroke: rgba(255,255,255,0.92); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .signal-svg rect { fill: rgba(255,255,255,0.92); stroke: none; }
  .cc-label { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 位置 */
  .wifi { grid-column: 1/3; grid-row: 1; }
  .data { grid-column: 3/5; grid-row: 1; }
  .music { grid-column: 1/3; grid-row: 2/4; flex-direction: column; padding: 12px; cursor: default; gap: 6px; }
  .brightness { grid-column: 3/4; grid-row: 2/4; flex-direction: column; justify-content: flex-end; padding: 8px 4px 6px; position: relative; overflow: hidden; touch-action: none; }
  .volume { grid-column: 4/5; grid-row: 2/4; flex-direction: column; justify-content: flex-end; padding: 8px 4px 6px; position: relative; overflow: hidden; touch-action: none; }
  .airplane, .flashlight, .lock, .settings {
    flex-direction: column;   /* 垂直：图标在上、文字在下 */
    gap: 6px;
    padding: 6px;
  }
  .airplane { grid-column: 1; grid-row: 4; }
  .flashlight { grid-column: 2; grid-row: 4; }
  .lock { grid-column: 3; grid-row: 4; }
  .settings { grid-column: 4; grid-row: 4; }

  /* 竖条（亮度/音量） */
  .bar-fill {
    position: absolute; bottom: 0; left: 0; width: 100%;
    background: rgba(255,255,255,0.25);
    pointer-events: none;
  }
  .bar-icon { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .bar-icon svg { width: 22px; height: 22px; fill: none; stroke: rgba(255,255,255,0.92); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }

  /* 音乐 */
  .music-info { flex: 0 0 auto; display: flex; flex-direction: column; gap: 2px; overflow: hidden; width: 100%; min-width: 0; }
  .music-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .music-artist { font-size: 12px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .music-controls { display: flex; justify-content: center; align-items: center; gap: 12px; }
  .m-btn {
    width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
    background: rgba(255,255,255,0.12);
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.25);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.92); transition: background 0.2s;
  }
  .m-btn:active { background: rgba(255,255,255,0.3); }
  .m-btn svg { width: 18px; height: 18px; fill: none; stroke: rgba(255,255,255,0.92); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .m-play { width: 42px; height: 42px; }
</style>
</head>
<body>

  <liquid-glass id="cc" mode="prominent" corner-radius="28" blur-amount="0.22" no-shadow
    saturation="150" elasticity="0" padding="18px">
    <div class="cc-grid">

      <!-- Wi-Fi -->
      <div class="cc-card wifi" id="cardWifi">
        <div class="cc-icon-circle"><svg viewBox="0 0 24 24">
          <path d="M1 7.5a16 16 0 0 1 22 0"/><path d="M3.5 11.5a12 12 0 0 1 17 0"/>
          <path d="M7 15.5a7 7 0 0 1 10 0"/><circle cx="12" cy="19" r="1.6"/>
        </svg></div>
        <span class="cc-label" id="wifiLabel">Wi-Fi</span>
      </div>

      <!-- 移动数据 -->
      <div class="cc-card data" id="cardData">
        <div class="cc-icon-circle"><svg viewBox="0 0 24 24" class="signal-svg">
          <rect x="3" y="15" width="3" height="6" rx="1"/><rect x="8" y="11" width="3" height="10" rx="1"/><rect x="13" y="7" width="3" height="14" rx="1"/><rect x="18" y="3" width="3" height="18" rx="1"/>
        </svg></div>
        <span class="cc-label" id="dataLabel">移动数据</span>
      </div>

      <!-- 音乐 -->
      <div class="cc-card music" id="cardMusic">
        <div class="music-info">
          <span class="music-title" id="musicTitle">液态玻璃 · 未在播放</span>
          <span class="music-artist" id="musicArtist">—</span>
        </div>
        <div class="music-controls">
          <button class="m-btn" id="mPrev"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6z"/><path d="M8 12l10-7v14z"/></svg></button>
          <button class="m-btn m-play" id="mPlay"><svg viewBox="0 0 24 24" id="iconPlay"><path d="M8 5l10 7-10 7z"/></svg>
            <svg viewBox="0 0 24 24" id="iconPause" style="display:none"><path d="M8 5h3v14H8z M13 5h3v14h-3z"/></svg></button>
          <button class="m-btn" id="mNext"><svg viewBox="0 0 24 24"><path d="M18 5h2v14h-2z"/><path d="M16 12l-9-7v14z"/></svg></button>
        </div>
      </div>

      <!-- 亮度 -->
      <div class="cc-card brightness" id="cardBrightness">
        <div class="bar-fill" id="barBright" style="height:60%"></div>
        <div class="bar-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></div>
      </div>

      <!-- 音量 -->
      <div class="cc-card volume" id="cardVolume">
        <div class="bar-fill" id="barVolume" style="height:40%"></div>
        <div class="bar-icon"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></div>
      </div>

      <!-- 飞行模式 -->
      <div class="cc-card airplane" id="cardAir">
        <div class="cc-icon-circle"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></div>
        <span class="cc-label">飞行模式</span>
      </div>

      <!-- 手电筒 -->
      <div class="cc-card flashlight" id="cardTorch">
        <div class="cc-icon-circle"><svg viewBox="0 0 24 24"><path d="M9 18c-4 0-6-2-6-6s2-6 6-6 6 2 6 6-2 6-6 6z"/><path d="M15 9l6-6"/><path d="M15 15l6 6"/></svg></div>
        <span class="cc-label">手电筒</span>
      </div>

      <!-- 锁屏 -->
      <div class="cc-card lock" id="cardLock">
        <div class="cc-icon-circle"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <span class="cc-label">锁屏</span>
      </div>

      <!-- 设置 -->
      <div class="cc-card settings" id="cardSet">
        <div class="cc-icon-circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
        <span class="cc-label">设置</span>
      </div>

    </div>
  </liquid-glass>

<script type="module" src="./liquid-glass.js?v=20260801"></script>
<script>
/* ============================================================
 * 控制中心 · 系统交互（移植自原项目 control-center.js）
 * 通过 NativeBridge（悬浮窗内绑定的完整 JsBridge）与系统交互：
 *   - 同步方法：getWifiState / getBrightness / getVolume / getMusicInfo …
 *   - 异步方法：execPrivileged（自动 root → shell → shizuku → su 通道）
 * ============================================================ */
(function () {
  'use strict';

  // ---------- NativeBridge 同步封装 ----------
  function bridgeCall(method) {
    for (var _len = arguments.length, args = Array(_len > 1 ? _len - 1 : 0), _key = 1; _key < _len; _key++) { args[_key - 1] = arguments[_key]; }
    try {
      if (typeof NativeBridge !== 'undefined' && NativeBridge[method]) {
        var raw = NativeBridge[method].apply(NativeBridge, args);
        if (typeof raw === 'string') {
          try { return JSON.parse(raw); } catch (e) { return { success: false }; }
        }
        return raw || { success: false };
      }
    } catch (e) {}
    return { success: false };
  }

  var getWifiState        = function () { return bridgeCall('getWifiState'); };
  var setWifiEnabled      = function (enable) { return bridgeCall('setWifiEnabled', enable); };
  var openWifiSettings    = function () { return bridgeCall('openWifiSettings'); };
  var getCurrentWifiInfo  = function () { return bridgeCall('getCurrentWifiInfo'); };
  var getMobileDataEnabled= function () { return bridgeCall('getMobileDataEnabled'); };
  var setMobileDataEnabled= function (enabled) { return bridgeCall('setMobileDataEnabled', enabled); };
  var getBrightness       = function () { return bridgeCall('getBrightness'); };
  var setBrightness       = function (val) { return bridgeCall('setBrightness', val); };
  var getVolume           = function () { return bridgeCall('getVolume'); };
  var setVolume           = function (val) { return bridgeCall('setVolume', val); };
  var setFlashlight       = function (enabled) { return bridgeCall('setFlashlight', enabled); };
  var getFlashlightState  = function () { return bridgeCall('getFlashlightState'); };
  var openSettings        = function () { return bridgeCall('openSettings'); };
  var openAirplaneModeSettings = function () { return bridgeCall('openAirplaneModeSettings'); };
  var getMusicInfo        = function () { return bridgeCall('getMusicInfo'); };
  var getSimInfo          = function () { return bridgeCall('getSimInfo'); };
  var getNetworkInfo      = function () { return bridgeCall('getNetworkInfo'); };
  var getSystemInfo       = function () { return bridgeCall('getSystemInfo'); };
  var getBatteryLevel     = function () { return bridgeCall('getBatteryLevel'); };
  var isCharging          = function () { return bridgeCall('isCharging'); };
  var mediaPlayPause      = function () { return bridgeCall('mediaPlayPause'); };
  var mediaNext           = function () { return bridgeCall('mediaNext'); };
  var mediaPrevious       = function () { return bridgeCall('mediaPrevious'); };
  var canWriteSettings    = function () { return bridgeCall('canWriteSettings'); };

  // ---------- 特权 Shell 执行（root → shell → shizuku → su 自动通道） ----------
  var ccSeq = 0, ccPending = {};
  window._onPrivilegedResult = function (j) {
    try {
      var r = typeof j === 'string' ? JSON.parse(j) : j;
      var cb = ccPending[r.callbackId];
      if (cb) { delete ccPending[r.callbackId]; cb(r); }
    } catch (e) {}
  };
  function execPrivileged(cmd, timeoutMs) {
    timeoutMs = timeoutMs || 6000;
    return new Promise(function (resolve) {
      try {
        var id = 'cc_' + (++ccSeq);
        ccPending[id] = resolve;
        NativeBridge.execPrivileged(cmd, id);
        setTimeout(function () {
          if (ccPending[id]) { delete ccPending[id]; resolve({ success: false, stderr: 'timeout' }); }
        }, timeoutMs);
      } catch (e) { resolve({ success: false, stderr: String(e) }); }
    });
  }
  function execOk(r) { return !!(r && r.statusCode === 0); }

  // ---------- 锁屏回调 ----------
  var LOCK_CB = 'cc_lock';
  window._onLockScreenResult = function (j) {
    try {
      var r = typeof j === 'string' ? JSON.parse(j) : j;
      if (r.callbackId === LOCK_CB) setActive('cardLock', false);
    } catch (e) {}
  };

  // ---------- DOM 工具 ----------
  function $(id) { return document.getElementById(id); }
  function setActive(id, active) {
    var el = $(id);
    if (el) el.classList.toggle('active', !!active);
  }

  // ---------- 开关逻辑 ----------
  async function toggleWifi(enable) {
    var r = await execPrivileged(enable ? 'svc wifi enable' : 'svc wifi disable');
    if (execOk(r)) return { success: true, method: 'shell' };
    var m = setWifiEnabled(enable);
    if (m && m.success) return { success: true, method: 'manager' };
    openWifiSettings();
    return { success: true, method: 'settingsPage', panelOpened: true };
  }
  async function toggleMobileData(enable) {
    var r = await execPrivileged(enable ? 'svc data enable' : 'svc data disable');
    if (execOk(r)) return { success: true, method: 'shell' };
    var m = setMobileDataEnabled(enable);
    return { success: !!(m && m.success), method: 'bridge', panelOpened: false };
  }
  async function toggleAirplaneMode(enable) {
    var state = enable ? '1' : '0';
    var r = await execPrivileged('settings put global airplane_mode_on ' + state);
    if (execOk(r)) {
      await execPrivileged('am broadcast -a android.intent.action.AIRPLANE_MODE --ez state ' + enable);
      return { success: true, method: 'shell' };
    }
    openAirplaneModeSettings();
    return { success: true, method: 'settingsPage', panelOpened: true };
  }
  async function lockScreen() {
    var r = await execPrivileged('input keyevent 26');
    if (execOk(r)) { setActive('cardLock', false); return; }
    try { NativeBridge.lockScreen(LOCK_CB); } catch (e) {}
  }

  // ---------- 状态读取 ----------
  async function getMobileDataState() {
    var r = await execPrivileged('settings get global mobile_data');
    if (execOk(r)) {
      var v = (r.stdout || '').trim();
      if (v === '1' || v === '0') return { enabled: v === '1', success: true };
    }
    var fb = getMobileDataEnabled();
    return fb && fb.success ? fb : { enabled: false, success: false };
  }
  async function getAirplaneMode() {
    var r = await execPrivileged('settings get global airplane_mode_on');
    if (execOk(r)) {
      var v = (r.stdout || '').trim();
      return { enabled: v === '1', success: true };
    }
    return { enabled: false, success: false };
  }

  // ---------- 标签更新 ----------
  function updateWifiLabel() {
    var labelEl = $('wifiLabel');
    if (!labelEl) return;
    var info = getCurrentWifiInfo();
    if (info && info.success && info.ssid) labelEl.textContent = info.ssid;
    else labelEl.textContent = 'Wi-Fi';
  }
  function updateCarrierLabel() {
    var labelEl = $('dataLabel');
    if (!labelEl) return;
    var simInfo = getSimInfo();
    if (!simInfo || !simInfo.success || !simInfo.sims || simInfo.sims.length === 0) {
      labelEl.textContent = '无信号'; return;
    }
    var readySims = simInfo.sims.filter(function (sim) {
      return sim.state === 5 && sim.operator && sim.operator.trim() !== '';
    });
    if (readySims.length === 0) { labelEl.textContent = '无信号'; return; }
    var names = readySims.map(function (s) { return s.operator; });
    var unique = names.filter(function (v, i) { return names.indexOf(v) === i; });
    labelEl.textContent = unique.length === 1 ? unique[0] : unique.join('/');
  }
  function updateMusic() {
    var music = getMusicInfo();
    var titleEl = $('musicTitle'), artistEl = $('musicArtist');
    if (!titleEl || !artistEl) return;
    if (music && music.success && music.title) {
      titleEl.textContent = music.title;
      artistEl.textContent = music.artist || '未知艺术家';
      $('iconPlay').style.display = music.isPlaying ? 'none' : 'block';
      $('iconPause').style.display = music.isPlaying ? 'block' : 'none';
    } else {
      titleEl.textContent = '未在播放';
      artistEl.textContent = '—';
      $('iconPlay').style.display = 'block';
      $('iconPause').style.display = 'none';
    }
  }

  // ---------- 状态同步 ----------
  async function syncInitialState() {
    var wifi = getWifiState();
    if (wifi && wifi.success) setActive('cardWifi', wifi.enabled);
    updateWifiLabel();

    try { var dataRes = await getMobileDataState(); if (dataRes && dataRes.success) setActive('cardData', dataRes.enabled); } catch (e) {}

    var flash = getFlashlightState();
    if (flash && flash.success) setActive('cardTorch', flash.enabled);

    updateCarrierLabel();

    try { var airRes = await getAirplaneMode(); if (airRes && airRes.success) setActive('cardAir', airRes.enabled); } catch (e) {}

    var bri = getBrightness();
    if (bri && bri.success) {
      var cur = bri.brightness != null ? bri.brightness : (bri.current || 0);
      var max = bri.max || 255;
      $('barBright').style.height = Math.round((cur / max) * 100) + '%';
    }
    var vol = getVolume();
    if (vol && vol.success) {
      var cur2 = vol.current || 0;
      var max2 = vol.max || 15;
      $('barVolume').style.height = Math.round((cur2 / max2) * 100) + '%';
    }
    updateMusic();
  }

  // ---------- 亮度 / 音量竖条 ----------
  function setupBar(cardId, barId, getVal, setVal, maxVal) {
    var card = $(cardId), bar = $(barId);
    var dragging = false, rafId = 0, rect = null;
    function update(clientY) {
      if (!rect) return;
      var h = Math.max(0, Math.min(1, 1 - (clientY - rect.top) / rect.height));
      bar.style.height = Math.round(h * 100) + '%';
      var val = Math.round(h * maxVal);
      var res = setVal(val);
      if (res && res.needPermission) {
        // 需要 WRITE_SETTINGS 权限时跳转授权
        try { NativeBridge.requestSettingsPermission(); } catch (e) {}
      }
    }
    card.addEventListener('pointerdown', function (e) {
      dragging = true;
      rect = card.getBoundingClientRect();
      card.setPointerCapture(e.pointerId);
      card.classList.add('dragging');
      update(e.clientY);
    });
    card.addEventListener('pointermove', function (e) {
      if (!dragging || rafId) return;
      rafId = requestAnimationFrame(function () { rafId = 0; update(e.clientY); });
    });
    function up(e) {
      dragging = false;
      card.classList.remove('dragging');
      if (rafId) cancelAnimationFrame(rafId);
      rafId = 0;
      if (card.hasPointerCapture(e.pointerId)) card.releasePointerCapture(e.pointerId);
    }
    card.addEventListener('pointerup', up);
    card.addEventListener('pointercancel', up);
    // 初始值
    var res = getVal();
    if (res && res.success) {
      var cur = res.brightness != null ? res.brightness : (res.current || 0);
      var max = res.max || maxVal;
      bar.style.height = Math.round((cur / max) * 100) + '%';
    }
  }
  setupBar('cardBrightness', 'barBright', getBrightness, setBrightness, 255);
  (function () {
    var info = getVolume();
    var max = (info && info.success && info.max) ? info.max : 15;
    setupBar('cardVolume', 'barVolume', getVolume, setVolume, max);
  })();

  // ---------- 卡片事件 ----------
  $('cardWifi').addEventListener('click', async function () {
    var state = getWifiState();
    if (!state || !state.success) return;
    var result = await toggleWifi(!state.enabled);
    if (result && result.success) {
      if (result.panelOpened) {
        setActive('cardWifi', true);
        setTimeout(function () { setActive('cardWifi', state.enabled); }, 400);
      } else {
        setActive('cardWifi', !state.enabled);
        updateWifiLabel();
      }
    }
  });
  $('cardData').addEventListener('click', async function () {
    var state = await getMobileDataState();
    if (!state || !state.success) return;
    var result = await toggleMobileData(!state.enabled);
    if (result && result.success) {
      if (result.panelOpened) {
        setActive('cardData', true);
        setTimeout(function () { setActive('cardData', state.enabled); }, 400);
      } else {
        setActive('cardData', !state.enabled);
      }
    }
  });
  $('cardAir').addEventListener('click', async function () {
    var state = await getAirplaneMode();
    if (!state || !state.success) return;
    var result = await toggleAirplaneMode(!state.enabled);
    if (result && result.success) {
      if (result.panelOpened) {
        setActive('cardAir', true);
        setTimeout(function () { setActive('cardAir', state.enabled); }, 400);
      } else {
        setActive('cardAir', !state.enabled);
      }
    }
  });
  $('cardTorch').addEventListener('click', function () {
    var state = getFlashlightState();
    var next = !(state && state.success ? state.enabled : false);
    var res = setFlashlight(next);
    if (res && res.success) setActive('cardTorch', next);
  });
  $('cardLock').addEventListener('click', function () {
    setActive('cardLock', true);
    lockScreen();
  });
  $('cardSet').addEventListener('click', function () { openSettings(); });

  // ---------- 音乐控制 ----------
  $('mPlay').addEventListener('click', function () { mediaPlayPause(); setTimeout(updateMusic, 150); });
  $('mPrev').addEventListener('click', function () { mediaPrevious(); setTimeout(updateMusic, 150); });
  $('mNext').addEventListener('click', function () { mediaNext(); setTimeout(updateMusic, 150); });

  // ---------- 启动：初始同步 + 定时刷新 ----------
  setTimeout(syncInitialState, 100);
  setInterval(syncInitialState, 2000);
})();
</script>
</body>
</html>
