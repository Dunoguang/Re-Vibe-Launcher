name: 🐾 Android 构建流水线 喵～

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 叼取代码 喵～
        uses: actions/checkout@v7.0.0

      - name: 🛠️ Node.js 环境准备 喵～
        uses: actions/setup-node@v6
        with: { node-version: '24' }
      
      - name: ☕ Java 环境准备 喵～
        uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: '25'

      - name: 🐘 Gradle 环境准备 喵～
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: 🏗️ 构建前端 喵～
        run: |
          cd pack
          npm ci
          ./build.sh

      - name: 🔑 签名配置 喵～
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/revibe-launcher.p12"
            echo "ANDROID_SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/revibe-launcher.p12" >> $GITHUB_ENV
            echo "ANDROID_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "ANDROID_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "✅ 签名配置完成 喵～"
          else
            echo "⚠️ 无签名密钥，将使用 Debug 签名 喵～"
          fi

      - name: 📦 打包 APK 喵～
        run: gradle --no-daemon :app:assembleRelease

      - name: ☁️ 上传并写入 Summary 喵～
        if: success()
        continue-on-error: true
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" | head -1)
          
          if [ ! -f "$APK" ]; then
            echo "❌ 没找到 Release APK 喵..." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          echo "📤 上传中..."
          RESP=$(curl -sS -X POST https://tempfile.org/api/upload/local \
            -F "files=@${APK}" -F "expiryHours=48")
          URL=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['files'][0]['url'] + 'download')")
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🐾 构建完成 喵～
          
          | 📦 产物 | 🔗 链接 | 📏 大小 | ⏰ 有效期 |
          |---------|---------|---------|-----------|
          | Release APK | [点击下载](${URL}) | $(du -h "$APK" | cut -f1) | 48 小时 |
          
          > \`${URL}\`
          EOF
          
          echo "DOWNLOAD_URL=${URL}"

      - name: 📦 同步上传 Actions 产物 喵～
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revibe-launcher-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 🐾 喵呜～
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✨ 好喵！去 Summary 看链接吧～" >> $GITHUB_STEP_SUMMARY
          else
            echo "😿 坏掉了呜...主人快来～" >> $GITHUB_STEP_SUMMARY
          fi
